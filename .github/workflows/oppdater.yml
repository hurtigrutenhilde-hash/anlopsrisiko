name: Oppdater dashboard

on:
  schedule:
    - cron: "17 * * * *"   # hver time, 17 minutter over (UTC)
  workflow_dispatch: {}      # «Run workflow»-knappen gir oppdatering med en gang

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bygg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - id: pages
        uses: actions/configure-pages@v5
      - name: Hent data og bygg siden
        run: python src/update.py
        env:
          BW_CLIENT_ID: ${{ secrets.BW_CLIENT_ID }}
          BW_CLIENT_SECRET: ${{ secrets.BW_CLIENT_SECRET }}
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          MET_USER_AGENT: anlopsrisiko/1.0 github.com/${{ github.repository }}
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
